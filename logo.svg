<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Fruta: coral-rosado, gradiente radial suave -->
    <radialGradient id="gf" cx="42%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#F09070"/>
      <stop offset="60%"  stop-color="#E06848"/>
      <stop offset="100%" stop-color="#C04E30"/>
    </radialGradient>
    <!-- Folha: verde vibrante -->
    <linearGradient id="gl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8CC844"/>
      <stop offset="100%" stop-color="#4A8018"/>
    </linearGradient>
  </defs>

  <!-- Fruta — oval levemente achatada na base -->
  <ellipse cx="32" cy="38" rx="20" ry="19" fill="url(#gf)"/>

  <!-- Brilho superior-esquerdo -->
  <ellipse cx="24" cy="28" rx="5" ry="7"
           fill="#fff" fill-opacity="0.20"
           transform="rotate(-30 24 28)"/>

  <!-- Caule -->
  <path d="M 32 19 Q 32 15 32 13"
        stroke="#6B3A18" stroke-width="2"
        stroke-linecap="round" fill="none"/>

  <!-- Folha — simples, apontando para esquerda-cima -->
  <path d="M 32 14 C 28 6, 16 7, 17 14 C 22 13, 28 13, 32 14 Z"
        fill="url(#gl)"/>

  <!-- Nervura da folha -->
  <path d="M 32 14 C 27 11, 20 10, 17 14"
        stroke="#fff" stroke-opacity="0.35"
        stroke-width="0.8" stroke-linecap="round" fill="none"/>
</svg>
